# Sanity-check the action against a tiny in-tree FastAPI fixture whose
# routing topology is clean (every path resolves to exactly one
# handler). On every PR the workflow:
#   1. runs the action against test/fixture/
#   2. asserts the structured outputs are populated
#   3. exercises the sticky-PR-comment + inline-annotation surfaces
#      against the live PR
# fail-on-finding is 'true': the fixture is defect-free, so the run must
# stay green. The assertion step verifies the pipeline actually ran
# (endpoints were recovered) and raised no false positives
# (findings-count == 0).
name: LiSA

on:
  pull_request:     # any PR — the action repo is small enough to self-test on every change
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required for the sticky PR comment

jobs:
  fastapi-routing-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run action against test/fixture
        id: run
        uses: ./
        with:
          main-file: test/fixture/app/main.py
          project-dir: test/fixture
          fail-on-finding: 'true'

      - name: Verify outputs
        run: |
          echo "endpoints-count=${{ steps.run.outputs.endpoints-count }}"
          echo "findings-count=${{ steps.run.outputs.findings-count }}"
          echo "high-severity-count=${{ steps.run.outputs.high-severity-count }}"
          # The fixture is defect-free: assert the pipeline actually ran
          # (at least one endpoint recovered — 0 would mean discovery is
          # broken even though the run succeeded) and that it raised no
          # false positives (findings-count == 0).
          test "${{ steps.run.outputs.endpoints-count }}" -ge 1
          test "${{ steps.run.outputs.findings-count }}" -eq 0
          test -f "${{ steps.run.outputs.report-path }}"
          test -f lisa-network-out/final-network.pdf

      - name: Upload analysis artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-network-report
          path: |
            lisa-network-out/report.json
            lisa-network-out/final-network.pdf
            lisa-network-out/final-network.txt
