# Drop this file at .github/workflows/routing-check.yml inside your
# FastAPI repo. Adjust `main-file` to your real entrypoint.
name: FastAPI routing check

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/routing-check.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # required to post / update the sticky PR comment
  checks: write          # reserved for the optional Checks API mode
  security-events: write # required to upload SARIF to GitHub Code Scanning

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 lets the endpoint-delta step resolve the merge-base
      # against origin/<base_ref>. With the default depth=1, the action
      # tries `git fetch --depth=200` on its own — that covers most cases,
      # but full history is the safe default for repos with squashed PRs
      # or long-lived branches.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run FastAPI routing check
        id: check
        uses: giacomozanatta/fastapi-routing-check@v0.1.0
        with:
          main-file: app/main.py
          fail-on-finding: 'true'
          severity-threshold: high
          annotations: 'true'      # inline annotations on the Files Changed tab
          comment-on-pr: 'true'    # sticky PR comment with file:line links

      # Upload SARIF to GitHub Code Scanning so findings render natively
      # in the PR's Security tab. Runs on `always()` so the SARIF is
      # uploaded even when the action gated the job on high-severity
      # findings (otherwise the upload would be skipped on the same runs
      # where the findings actually exist). `category` keeps these
      # results in their own bucket so other analyzers' findings on the
      # same ref are not overwritten.
      #
      # GitHub Code Scanning is FREE on public repositories. On PRIVATE
      # repos it requires GitHub Advanced Security (GHAS), which is only
      # available on Enterprise plans for organisations — without GHAS,
      # this upload step will fail with a 403. `continue-on-error: true`
      # keeps the job green in that case; reviewers consume the SARIF
      # via the artefact uploaded below (VS Code's "SARIF Viewer"
      # extension renders it locally), and the sticky PR comment +
      # inline annotations continue to surface findings without GHAS.
      - name: Upload SARIF to Code Scanning
        if: always() && steps.check.outputs.sarif-path != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.check.outputs.sarif-path }}
          category: fastapi-routing-check

      - name: Upload analysis artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-network-report
          path: |
            lisa-network-out/report.json
            lisa-network-out/results.sarif
            lisa-network-out/delta.json
            lisa-network-out/final-network.pdf
            lisa-network-out/final-network.txt

      - name: Summary
        if: always()
        run: |
          echo "Endpoints recovered : ${{ steps.check.outputs.endpoints-count }}"
          echo "Findings (total)    : ${{ steps.check.outputs.findings-count }}"
          echo "Findings (high)     : ${{ steps.check.outputs.high-severity-count }}"
          echo "Endpoints added     : ${{ steps.check.outputs.endpoints-added }}"
          echo "Endpoints removed   : ${{ steps.check.outputs.endpoints-removed }}"
          echo "Endpoints moved     : ${{ steps.check.outputs.endpoints-moved }}"
